events {}

http
{
    server {
        listen 8181;
        root ./public;
        # name of server, in local we set to localhost
        server_name localhost;
        location /api/
        {
            proxy_pass http://backend;
        }
        location /cgi/ndex.php # check how thw cgi acually works
        {
            root /var/www/cgi-bin;
        }
        location /html/index.html
        {
            root /var/www/html;
        }
    }

    server 
    {
        listen 8182;
        server_name localhost; 
        return 200 "Hi there!, This is 8182!\n";
    }
}

# cgi is Common Gateway Interface